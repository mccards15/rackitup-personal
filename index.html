const SK="workout-logs-v4";
function loadLogs(){try{const d=localStorage.getItem(SK);return d?JSON.parse(d):{};}catch(e){return{};}}
function saveLogs(l){try{localStorage.setItem(SK,JSON.stringify(l));}catch(e){}}
function localDate(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtTime(s){return Math.floor(s/60)+":"+(s%60).toString().padStart(2,"0");}

function getActiveBlock(){
  const today=localDate();
  if(today<="2026-06-22")return"blitz";
  if(today<="2026-06-26")return"blitz"; // show blitz during travel gap
  if(today<="2026-07-09")return"europe";
  if(today<="2026-07-11")return"europe";
  return"normal";
}

function buildExerciseHistory(allLogs){
  const h={};
  Object.entries(allLogs).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([lk,log])=>{
    const dp=lk.split("_")[0];if(!log.exercises)return;
    Object.entries(log.exercises).forEach(([exId,sets])=>{
      if(!h[exId])h[exId]=[];
      const done=Object.entries(sets).filter(([_,s])=>s&&s.done).map(([idx,s])=>({setIndex:Number(idx),weight:s.weight?Number(s.weight):null,reps:s.reps?Number(s.reps):null,date:dp}));
      if(done.length>0)h[exId].push({date:dp,sets:done});
    });
  });return h;
}
function getLastMax(h){if(!h||!h.length)return null;const w=h[h.length-1].sets.filter(s=>s.weight!=null).map(s=>s.weight);return w.length?Math.max(...w):null;}
function getLastWeights(h){if(!h||!h.length)return null;return h[h.length-1].sets.map(s=>s.weight);}
function getPR(h){if(!h||!h.length)return null;let m=0;h.forEach(s=>s.sets.forEach(x=>{if(x.weight>m)m=x.weight;}));return m>0?m:null;}

const HS={fontFamily:"'Oswald',sans-serif",fontWeight:600,letterSpacing:"0.02em",textTransform:"uppercase"};
const MS={fontFamily:"'JetBrains Mono',monospace"};

function RestTimer({seconds,onDone,onSkip}){
  const end=useRef(Date.now()+seconds*1000);const[rem,setRem]=useState(seconds);const ref=useRef();
  useEffect(()=>{end.current=Date.now()+seconds*1000;const tick=()=>{const l=Math.max(0,Math.round((end.current-Date.now())/1000));setRem(l);if(l<=0){clearInterval(ref.current);try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}setTimeout(onDone,300);}};ref.current=setInterval(tick,250);const v=()=>{if(document.visibilityState==="visible")tick();};document.addEventListener("visibilitychange",v);return()=>{clearInterval(ref.current);document.removeEventListener("visibilitychange",v);};},[seconds]);
  const pct=((seconds-rem)/seconds)*100;
  return<div style={{position:"fixed",inset:0,background:T.timerBg,zIndex:100,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
    <div style={{...HS,fontSize:16,color:T.textDim,marginBottom:12}}>REST</div>
    <div style={{position:"relative",width:200,height:200,marginBottom:32}}>
      <svg width="200"height="200"viewBox="0 0 200 200"><circle cx="100"cy="100"r="88"fill="none"stroke={T.border}strokeWidth="6"/><circle cx="100"cy="100"r="88"fill="none"stroke={T.accent}strokeWidth="6"strokeDasharray={553}strokeDashoffset={553*(1-pct/100)}strokeLinecap="round"transform="rotate(-90 100 100)"style={{transition:"stroke-dashoffset 1s linear"}}/></svg>
      <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{...MS,fontSize:52,fontWeight:600,color:rem<=5?T.accent:T.text}}>{fmtTime(rem)}</span></div>
    </div>
    <button onClick={onSkip} style={{background:"none",border:"1px solid "+T.textMuted,color:T.textDim,padding:"10px 32px",borderRadius:8,fontSize:15,cursor:"pointer"}}>Skip</button>
  </div>;
}

function NumIn({value,onChange,placeholder,width,step}){const w=width||72,s=step||5;return<div style={{display:"flex",alignItems:"center",gap:4}}>
  <button onClick={()=>onChange(String(Math.max(0,(Number(value)||0)-s)))} style={{width:28,height:36,background:T.card,border:"1px solid "+T.border,borderRadius:6,color:T.textDim,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><I name="minus"size={14}/></button>
  <input type="text"inputMode="decimal"value={value||""}placeholder={placeholder}onChange={e=>onChange(e.target.value.replace(/[^0-9.]/g,""))}style={{width:w,height:36,background:T.bg,border:"1px solid "+T.border,borderRadius:6,color:T.text,textAlign:"center",fontSize:16,...MS,outline:"none",padding:0}}/>
  <button onClick={()=>onChange(String((Number(value)||0)+s))} style={{width:28,height:36,background:T.card,border:"1px solid "+T.border,borderRadius:6,color:T.textDim,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><I name="plus"size={14}/></button>
</div>;}

function RepIn({value,onChange,target}){return<div style={{display:"flex",alignItems:"center",gap:4}}>
  <button onClick={()=>onChange(String(Math.max(0,(Number(value)||0)-1)))} style={{width:28,height:36,background:T.card,border:"1px solid "+T.border,borderRadius:6,color:T.textDim,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><I name="minus"size={14}/></button>
  <input type="text"inputMode="numeric"pattern="[0-9]*"value={value||""}placeholder={String(target)}onChange={e=>onChange(e.target.value.replace(/[^0-9]/g,""))}style={{width:48,height:36,background:T.bg,border:"1px solid "+T.border,borderRadius:6,color:T.text,textAlign:"center",fontSize:16,...MS,outline:"none",padding:0}}/>
  <button onClick={()=>onChange(String((Number(value)||0)+1))} style={{width:28,height:36,background:T.card,border:"1px solid "+T.border,borderRadius:6,color:T.textDim,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><I name="plus"size={14}/></button>
</div>;}

    <div style={{...MS,fontSize:13,color:T.textMuted,width:24,textAlign:"center"}}>{si+1}</div>
    {isW&&<><NumIn value={ld?ld.weight:undefined} onChange={v=>onUp({...(ld||{}),weight:v})} placeholder="lbs" width={64}/><span style={{color:T.textMuted,fontSize:13}}>{X}</span><RepIn value={ld?ld.reps:undefined} onChange={v=>onUp({...(ld||{}),reps:v})} target={ex.reps}/></>}
    {isBw&&<RepIn value={ld?ld.reps:undefined} onChange={v=>onUp({...(ld||{}),reps:v})} target={typeof ex.reps==="string"?"max":ex.reps}/>}
    <button onClick={onTog} style={{marginLeft:"auto",width:36,height:36,borderRadius:8,border:done?"2px solid "+T.green:"none",cursor:"pointer",background:done?T.greenGlow:T.accent,display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.15s"}}>
      {done?<I name="undo2"size={16}color={T.green}/>:<I name="check"size={18}color="#fff"/>}
    </button>
  </div>;
}

function ExCard({ex,logs,onLog,onTog,isG,isFirst,isLast,lastW}){
  const rl=ex.restSeconds>=60?(ex.restSeconds/60)+" min":ex.restSeconds+"s";
  return<div style={{background:T.card,borderRadius:isG?0:12,padding:"14px 16px",borderLeft:isG?"none":"3px solid "+T.accent,borderTop:isG&&!isFirst?"1px dashed "+T.border:"none",borderTopLeftRadius:isG&&isFirst?12:0,borderTopRightRadius:isG&&isFirst?12:0,borderBottomLeftRadius:isG&&isLast?12:0,borderBottomRightRadius:isG&&isLast?12:0}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
      <div style={{flex:1}}>
        <div style={{fontSize:15,fontWeight:600,color:T.text,lineHeight:1.3}}>{ex.name}</div>
        <div style={{fontSize:12,color:T.textDim,marginTop:2}}>{ex.sets+X+ex.reps+" "+D+" "+ex.intensity+(ex.restSeconds>0?" "+D+" "+rl+" rest":"")}</div>
      </div>
      {lastW!=null&&ex.type==="weighted"&&<div style={{background:T.blueGlow,border:"1px solid "+T.blue+"44",borderRadius:6,padding:"3px 8px",fontSize:11,color:T.blue,fontWeight:600,...MS,whiteSpace:"nowrap",marginLeft:8}}>{"Last: "+lastW+" lbs"}</div>}
    </div>
    {Array.from({length:ex.sets}).map((_,i)=><SetRow key={i} si={i} ex={ex} ld={logs?logs[i]:undefined} done={logs&&logs[i]&&logs[i].done} onUp={data=>onLog(ex.id,i,data)} onTog={()=>onTog(ex.id,i)}/>)}
  </div>;
}

function ActiveWorkout({day,onFinish,existingLog,allLogs}){
  const exH=buildExerciseHistory(allLogs);const bc=BLOCKS.find(b=>b.id===day.blockId);const blockColor=bc?bc.color:T.accent;
  const buildInit=()=>{const init=existingLog&&existingLog.exercises?JSON.parse(JSON.stringify(existingLog.exercises)):{};
    day.exercises.forEach(ex=>{if(ex.type==="weighted"&&!init[ex.id]){const lw=getLastWeights(exH[ex.id]);if(lw){const s={};for(let i=0;i<ex.sets;i++){const wt=i<lw.length?lw[i]:lw[lw.length-1];s[i]={weight:wt!=null?String(wt):"",reps:"",done:false};}init[ex.id]=s;}}});return init;};
  const[logs,setLogs]=useState(buildInit);
  const[timer,setTimer]=useState(false);const[timerSec,setTimerSec]=useState(60);
  const[elapsed,setElapsed]=useState(0);const[vm,setVm]=useState("scroll");const[ci,setCi]=useState(0);
  const st=useRef(existingLog?(existingLog.startedAt||Date.now()):Date.now());
  useEffect(()=>{const id=setInterval(()=>setElapsed(Math.floor((Date.now()-st.current)/1000)),1000);return()=>clearInterval(id);},[]);

  const upLog=(exId,si,data)=>{setLogs(p=>({...p,[exId]:{...p[exId],[si]:{...(p[exId]?p[exId][si]:{}), ...data}}}));};
  const togSet=(exId,si)=>{const ex=day.exercises.find(e=>e.id===exId);const done=logs[exId]&&logs[exId][si]&&logs[exId][si].done;
    if(done){setLogs(p=>({...p,[exId]:{...p[exId],[si]:{...(p[exId]?p[exId][si]:{}),done:false}}}));}
    else{setLogs(p=>({...p,[exId]:{...p[exId],[si]:{...(p[exId]?p[exId][si]:{}),done:true,completedAt:Date.now()}}}));
      if(ex&&ex.group){const ge=day.exercises.filter(e=>e.group===ex.group);const last=ge[ge.length-1];if(exId===last.id&&last.restSeconds>0){setTimerSec(last.restSeconds);setTimer(true);}}
      else if(ex&&ex.restSeconds>0){setTimerSec(ex.restSeconds);setTimer(true);}}};

  const totalSets=day.exercises.reduce((s,e)=>s+e.sets,0);
  const doneSets=Object.values(logs).reduce((s,e)=>s+Object.values(e).filter(x=>x&&x.done).length,0);
  const pct=totalSets>0?Math.round((doneSets/totalSets)*100):0;

  const secs=(()=>{const r=[];let cg=null,buf=[];day.exercises.forEach(ex=>{if(ex.group&&ex.group===cg)buf.push(ex);else if(ex.group){if(buf.length)r.push({type:"group",group:cg,exercises:buf});cg=ex.group;buf=[ex];}else{if(buf.length){r.push({type:"group",group:cg,exercises:buf});buf=[];cg=null;}r.push({type:"single",exercise:ex});}});if(buf.length)r.push({type:"group",group:cg,exercises:buf});return r;})();

  return<div style={{fontFamily:"'Source Sans 3',sans-serif",background:T.bg,color:T.text,minHeight:"100vh",maxWidth:480,margin:"0 auto",paddingBottom:100}}>
    {timer&&<RestTimer seconds={timerSec} onDone={()=>setTimer(false)} onSkip={()=>setTimer(false)}/>}
    <div style={{position:"sticky",top:0,zIndex:50,background:T.bg,borderBottom:"1px solid "+T.border,padding:"12px 16px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><div style={{...HS,fontSize:16,color:blockColor}}>{day.label}</div><div style={{fontSize:12,color:T.textDim}}>{day.date+(day.sessionNum?" "+D+" Session "+day.sessionNum:"")}</div></div>
        <div style={{textAlign:"right"}}><div style={{...MS,fontSize:20,color:T.text}}>{fmtTime(elapsed)}</div><div style={{fontSize:12,color:T.textDim}}>{pct+"% complete"}</div></div>
      </div>
      <div style={{height:3,background:T.border,borderRadius:2,marginTop:8}}><div style={{height:"100%",background:blockColor,borderRadius:2,width:pct+"%",transition:"width 0.3s ease"}}/></div>
      <div style={{display:"flex",gap:8,marginTop:8}}>
        <button onClick={()=>setVm("scroll")} style={{flex:1,padding:"6px 0",background:vm==="scroll"?blockColor+"22":"transparent",border:"1px solid "+(vm==="scroll"?blockColor:T.border),borderRadius:6,color:vm==="scroll"?blockColor:T.textDim,fontSize:12,fontWeight:500,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}><I name="list"size={13}/> Full View</button>
        <button onClick={()=>setVm("single")} style={{flex:1,padding:"6px 0",background:vm==="single"?blockColor+"22":"transparent",border:"1px solid "+(vm==="single"?blockColor:T.border),borderRadius:6,color:vm==="single"?blockColor:T.textDim,fontSize:12,fontWeight:500,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}><I name="eye"size={13}/> Focus View</button>
      </div>
    </div>
    <div style={{padding:"12px 16px"}}>
      {vm==="scroll"?<div style={{display:"flex",flexDirection:"column",gap:10}}>
        {secs.map((sec,si)=>{if(sec.type==="group")return<div key={si} style={{borderLeft:"3px solid "+blockColor,borderRadius:12,overflow:"hidden"}}><div style={{background:blockColor+"22",padding:"6px 14px",fontSize:12,color:blockColor,fontWeight:600,...HS}}>{GL[sec.group]||sec.group}</div>{sec.exercises.map((ex,ei)=><ExCard key={ex.id} ex={ex} logs={logs[ex.id]} onLog={upLog} onTog={togSet} isG isFirst={ei===0} isLast={ei===sec.exercises.length-1} lastW={getLastMax(exH[ex.id])}/>)}</div>;
          return<ExCard key={sec.exercise.id} ex={sec.exercise} logs={logs[sec.exercise.id]} onLog={upLog} onTog={togSet} lastW={getLastMax(exH[sec.exercise.id])}/>;
        })}
      </div>:<div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <button onClick={()=>setCi(Math.max(0,ci-1))} disabled={ci===0} style={{width:40,height:40,borderRadius:8,background:T.card,border:"1px solid "+T.border,color:ci===0?T.textMuted:T.text,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><I name="chevronLeft"size={20}/></button>
          <div style={{...MS,fontSize:13,color:T.textDim}}>{(ci+1)+" / "+day.exercises.length}</div>
          <button onClick={()=>setCi(Math.min(day.exercises.length-1,ci+1))} disabled={ci===day.exercises.length-1} style={{width:40,height:40,borderRadius:8,background:T.card,border:"1px solid "+T.border,color:ci===day.exercises.length-1?T.textMuted:T.text,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><I name="chevronRight"size={20}/></button>
        </div>
        {day.exercises[ci]&&<ExCard ex={day.exercises[ci]} logs={logs[day.exercises[ci].id]} onLog={upLog} onTog={togSet} lastW={getLastMax(exH[day.exercises[ci].id])}/>}
      </div>}
    </div>
    <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:50}}><div style={{maxWidth:480,margin:"0 auto",padding:"12px 16px",background:"linear-gradient(transparent, "+T.bg+" 30%)"}}>
      <button onClick={()=>onFinish({dayId:day.id,exercises:logs,startedAt:st.current,finishedAt:Date.now(),elapsed})} style={{width:"100%",padding:"14px 0",background:pct===100?T.green:blockColor,border:"none",borderRadius:10,color:"#fff",fontSize:16,fontWeight:600,fontFamily:"'Oswald'",letterSpacing:"0.05em",textTransform:"uppercase",cursor:"pointer"}}>{pct===100?"Complete Workout "+TK:"Finish Workout ("+pct+"%)"}</button>
    </div></div>
  </div>;
}

function ExHistDetail({exId,onBack,allLogs}){
  const allEx={};ALL_DAYS.forEach(d=>d.exercises.forEach(ex=>{if(!allEx[ex.id])allEx[ex.id]=ex;}));const ex=allEx[exId];
  const h=buildExerciseHistory(allLogs);const eh=h[exId]||[];const pr=getPR(eh);
  return<div style={{fontFamily:"'Source Sans 3',sans-serif",background:T.bg,color:T.text,minHeight:"100vh",maxWidth:480,margin:"0 auto"}}>
    <div style={{padding:"16px",borderBottom:"1px solid "+T.border}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:T.accent,cursor:"pointer",padding:4}}><I name="chevronLeft"size={24}/></button>
        <div><div style={{...HS,fontSize:18,color:T.text}}>{ex?ex.name:""}</div><div style={{fontSize:12,color:T.textDim}}>{ex?(ex.muscle+" "+D+" "+ex.sets+X+ex.reps+" "+D+" "+ex.intensity):""}</div></div>
      </div>
    </div>
    <div style={{padding:16}}>
      {pr!=null&&<div style={{background:T.accentGlow,border:"1px solid "+T.accent+"44",borderRadius:10,padding:"12px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:12}}><I name="trophy"size={22}color={T.accent}/><div><div style={{fontSize:12,color:T.accent,...HS}}>Personal Record</div><div style={{...MS,fontSize:22,color:T.text,fontWeight:600}}>{pr+" lbs"}</div></div></div>}
      {eh.length===0?<div style={{textAlign:"center",padding:"40px 20px",color:T.textDim}}><I name="dumbbell"size={32}color={T.textMuted}style={{marginBottom:8,opacity:0.3}}/><div style={{fontSize:15}}>No history yet.</div></div>:
      <div style={{display:"flex",flexDirection:"column",gap:10}}>{[...eh].reverse().map((s,si)=><div key={si} style={{background:T.card,borderRadius:10,padding:"12px 16px"}}><div style={{fontSize:13,color:T.accent,fontWeight:600,marginBottom:8}}>{s.date}</div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{s.sets.map((set,i)=><div key={i} style={{background:T.bg,borderRadius:6,padding:"6px 10px",border:"1px solid "+T.border,minWidth:70,textAlign:"center"}}><div style={{...MS,fontSize:14,color:T.text}}>{set.weight!=null?(set.weight+" lbs"):"BW"}</div><div style={{fontSize:11,color:T.textDim}}>{set.reps!=null?(set.reps+" reps"):M}</div></div>)}</div></div>)}</div>}
    </div>
  </div>;
}

function MuscleDetail({mk,onBack,onSelEx,allLogs}){
  const mg=MG[mk];const allEx=[];const seen=new Set();
  ALL_DAYS.forEach(d=>d.exercises.forEach(ex=>{if(ex.muscle===mk&&!seen.has(ex.id)){seen.add(ex.id);allEx.push(ex);}}));
  const h=buildExerciseHistory(allLogs);
  return<div style={{fontFamily:"'Source Sans 3',sans-serif",background:T.bg,color:T.text,minHeight:"100vh",maxWidth:480,margin:"0 auto"}}>
    <div style={{padding:"16px",borderBottom:"1px solid "+T.border}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}><button onClick={onBack} style={{background:"none",border:"none",color:T.accent,cursor:"pointer",padding:4}}><I name="chevronLeft"size={24}/></button><div style={{...HS,fontSize:22,color:T.text}}>{mg?mg.label:""}</div></div>
    </div>
    <div style={{padding:16}}><div style={{display:"flex",flexDirection:"column",gap:8}}>
      {allEx.map(ex=>{const eh=h[ex.id]||[];const lm=getLastMax(eh);const pr=getPR(eh);const s=eh.length;return<div key={ex.id} onClick={()=>onSelEx(ex.id)} style={{background:T.card,borderRadius:10,padding:"14px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:14,border:"1px solid "+T.border}}>
        <div style={{flex:1}}><div style={{fontSize:15,fontWeight:600,color:T.text}}>{ex.name}</div><div style={{fontSize:12,color:T.textDim,marginTop:2}}>{ex.sets+X+ex.reps+" "+D+" "+ex.intensity}</div><div style={{fontSize:12,color:T.textMuted,marginTop:2}}>{s>0?(s+" session"+(s>1?"s":"")+" logged"):"No history"}{lm!=null?(" "+D+" Last: "+lm+" lbs"):""}{pr!=null?(" "+D+" PR: "+pr+" lbs"):""}</div></div>
        <I name="chevronRight"size={18}color={T.textMuted}/>
      </div>;})}
    </div></div>
  </div>;
}

function HistScreen({allLogs,onBack}){
  const[sm,setSm]=useState(null);const[se,setSe]=useState(null);
  if(se)return<ExHistDetail exId={se} onBack={()=>setSe(null)} allLogs={allLogs}/>;
  if(sm)return<MuscleDetail mk={sm} onBack={()=>setSm(null)} onSelEx={setSe} allLogs={allLogs}/>;
  const h=buildExerciseHistory(allLogs);const ms={};
  Object.keys(MG).forEach(mk=>{const ex=new Set();ALL_DAYS.forEach(d=>d.exercises.forEach(e=>{if(e.muscle===mk)ex.add(e.id);}));const lc=[...ex].filter(id=>h[id]&&h[id].length>0).length;ms[mk]={total:ex.size,logged:lc};});
  return<div style={{fontFamily:"'Source Sans 3',sans-serif",background:T.bg,color:T.text,minHeight:"100vh",maxWidth:480,margin:"0 auto"}}>
    <div style={{padding:"16px",borderBottom:"1px solid "+T.border}}><div style={{display:"flex",alignItems:"center",gap:12}}><button onClick={onBack} style={{background:"none",border:"none",color:T.accent,cursor:"pointer",padding:4}}><I name="chevronLeft"size={24}/></button><div style={{...HS,fontSize:22,color:T.text}}>Progress</div></div></div>
    <div style={{padding:16}}>
      <div style={{...HS,fontSize:13,color:T.textDim,marginBottom:10}}>MUSCLE GROUPS</div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {Object.entries(MG).map(([key,mg])=>{const st=ms[key];return<div key={key} onClick={()=>setSm(key)} style={{background:T.card,borderRadius:12,padding:"16px",cursor:"pointer",display:"flex",alignItems:"center",gap:14,border:"1px solid "+T.border}}>
          <div style={{width:44,height:44,borderRadius:10,background:mg.color+"18",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><I name="dumbbell"size={20}color={mg.color}/></div>
          <div style={{flex:1}}><div style={{fontSize:16,fontWeight:600,color:T.text}}>{mg.label}</div><div style={{fontSize:12,color:T.textDim}}>{st.total+" exercise"+(st.total!==1?"s":"")+(st.logged>0?" "+D+" "+st.logged+" with history":"")}</div></div>
          <I name="chevronRight"size={18}color={T.textMuted}/>
        </div>;})}
      </div>
    </div>
  </div>;
}

function HomeScreen({onStartDay,onViewHistory,logs,activeBlockId,setActiveBlockId}){
  const today=localDate();const bc=BLOCKS.find(b=>b.id===activeBlockId);
  const days=ALL_DAYS.filter(d=>d.blockId===activeBlockId);
  const totalAll=ALL_DAYS.length;const completedAll=Object.keys(logs).length;

  return<div style={{fontFamily:"'Source Sans 3',sans-serif",background:T.bg,color:T.text,minHeight:"100vh",maxWidth:480,margin:"0 auto"}}>
    <div style={{padding:"20px 16px 16px",background:"linear-gradient(180deg, "+(bc?bc.color:T.accent)+"11, transparent)"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}><span style={{...HS,fontSize:24,color:T.accent,letterSpacing:"0.04em"}}>RACK</span><span style={{...HS,fontSize:24,color:T.text,letterSpacing:"0.04em"}}>IT</span><span style={{...HS,fontSize:24,color:T.accent,letterSpacing:"0.04em"}}>UP</span></div>
      <div style={{...HS,fontSize:13,color:bc?bc.color:T.accent,marginBottom:2}}>SUMMER CUT & TRAVEL</div>
      <div style={{...HS,fontSize:22,color:T.text,lineHeight:1.2}}>{bc?bc.name:""}</div>
      <div style={{fontSize:13,color:T.textDim,marginTop:4}}>{bc?bc.range:""+" "+D+" 30-min sessions"}</div>

      <div style={{display:"flex",gap:6,marginTop:12}}>
        {BLOCKS.map(b=><button key={b.id} onClick={()=>setActiveBlockId(b.id)} style={{flex:1,padding:"6px 4px",background:activeBlockId===b.id?b.color+"22":"transparent",border:"1px solid "+(activeBlockId===b.id?b.color+"66":T.border),borderRadius:8,cursor:"pointer",textAlign:"center"}}>
          <I name={b.icon} size={16} color={activeBlockId===b.id?b.color:T.textMuted} style={{display:"block",margin:"0 auto 2px"}}/>
          <div style={{fontSize:10,color:activeBlockId===b.id?b.color:T.textMuted,fontWeight:600,...HS}}>{b.id==="blitz"?"Blitz":b.id==="europe"?"Europe":"Home"}</div>
        </button>)}
      </div>

      <div style={{display:"flex",gap:12,marginTop:12}}>
        <div style={{background:T.card,border:"1px solid "+T.border,borderRadius:8,padding:"8px 14px",flex:1,textAlign:"center"}}><div style={{...MS,fontSize:22,color:T.text,fontWeight:600}}>{completedAll}</div><div style={{fontSize:11,color:T.textDim}}>Done</div></div>
        <div style={{background:T.card,border:"1px solid "+T.border,borderRadius:8,padding:"8px 14px",flex:1,textAlign:"center"}}><div style={{...MS,fontSize:22,color:T.text,fontWeight:600}}>{totalAll-completedAll}</div><div style={{fontSize:11,color:T.textDim}}>Remaining</div></div>
        <button onClick={onViewHistory} style={{background:T.card,border:"1px solid "+T.border,borderRadius:8,padding:"8px 14px",flex:1,textAlign:"center",cursor:"pointer",color:T.text}}><I name="trendingUp"size={20}style={{margin:"0 auto 2px",display:"block",opacity:0.8}}/><div style={{fontSize:11,color:T.textDim}}>Progress</div></button>
      </div>
    </div>
    <div style={{padding:"8px 16px 24px"}}>
      <div style={{...HS,fontSize:13,color:T.textDim,marginBottom:10}}>{activeBlockId==="europe"?"SESSIONS":"SCHEDULE"}</div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {days.map((day,di)=>{
          const isToday=day.date===today;
          const logKey=Object.keys(logs).find(k=>k.startsWith(day.date)&&logs[k]&&logs[k].dayId===day.id);
          const done=!!logKey;
          const dc=bc?bc.color:T.accent;
          return<div key={day.id} onClick={()=>onStartDay(day)} style={{background:isToday?dc+"15":T.card,border:"1px solid "+(isToday?dc+"66":T.border),borderRadius:12,padding:"14px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:14,transition:"all 0.15s"}}>
            <div style={{width:42,height:42,borderRadius:10,background:done?T.greenGlow:dc+"15",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              {done?<I name="check"size={20}color={T.green}/>:<I name={bc?bc.icon:"dumbbell"}size={20}color={dc}/>}
            </div>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontSize:15,fontWeight:600,color:T.text}}>{day.sessionNum?("Session "+day.sessionNum+": "+day.label):day.label}</span>
                {isToday&&<span style={{fontSize:10,background:dc,color:"#fff",padding:"1px 6px",borderRadius:4,fontWeight:600,...HS}}>TODAY</span>}
              </div>
              <div style={{fontSize:12,color:T.textDim}}>{day.date.slice(5)+" "+D+" "+day.exercises.length+" exercises "+D+" ~30 min"}</div>
            </div>
            <I name="chevronRight"size={18}color={T.textMuted}/>
          </div>;
        })}
      </div>
    </div>
  </div>;
}

function App(){
  const[screen,setScreen]=useState("home");const[activeDay,setActiveDay]=useState(null);const[allLogs,setAllLogs]=useState(loadLogs());
  const[activeBlockId,setActiveBlockId]=useState(getActiveBlock());
  const startDay=(day)=>{setActiveDay(day);setScreen("workout");};
  const finishWorkout=(ld)=>{const key=localDate()+"_"+ld.dayId;const up={...allLogs,[key]:ld};setAllLogs(up);saveLogs(up);setScreen("home");setActiveDay(null);};
  if(screen==="workout"&&activeDay)return<ActiveWorkout day={activeDay} onFinish={finishWorkout} existingLog={allLogs[localDate()+"_"+activeDay.id]} allLogs={allLogs}/>;
  if(screen==="history")return<HistScreen allLogs={allLogs} onBack={()=>setScreen("home")}/>;
  return<HomeScreen onStartDay={startDay} onViewHistory={()=>setScreen("history")} logs={allLogs} activeBlockId={activeBlockId} setActiveBlockId={setActiveBlockId}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
