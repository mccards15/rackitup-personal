/* ============================================================
   STORAGE
   v5 keys logged sets by canonical slug. On first run it migrates
   v4 data (keyed by per-session instance id) through LEGACY.
   ============================================================ */
const SK="rackitup-v5",OLD_SK="workout-logs-v4";

function migrateV4(){
  try{
    const raw=localStorage.getItem(OLD_SK);if(!raw)return{};
    const old=JSON.parse(raw),out={};
    Object.entries(old).forEach(([key,log])=>{
      if(!log||!log.exercises)return;
      const ex={};
      Object.entries(log.exercises).forEach(([oldId,sets])=>{
        const slug=LEGACY[oldId];if(!slug)return;
        ex[slug]=sets;
      });
      if(Object.keys(ex).length) out["legacy_"+key]={dayId:log.dayId||null,legacy:true,
        exercises:ex,startedAt:log.startedAt||null,finishedAt:log.finishedAt||null,
        elapsed:log.elapsed||0,completed:true,date:key.split("_")[0]};
    });
    return out;
  }catch(e){return{};}
}

function loadLogs(){
  try{
    const raw=localStorage.getItem(SK);
    if(raw)return JSON.parse(raw);
    const migrated=migrateV4();
    localStorage.setItem(SK,JSON.stringify(migrated));
    return migrated;
  }catch(e){return{};}
}
function saveLogs(l){try{localStorage.setItem(SK,JSON.stringify(l));}catch(e){}}

/* ============================================================
   QUEUE
   The program runs as an ordered queue, not a calendar. Missing a
   session changes nothing — it simply stays next in line.

   Two parts:
     FIXED — bridge, dead period, camp. Run once, in order.
     CYCLE — the 12 in-season sessions. Repeat indefinitely; each
             pass is a "cycle" and is logged separately so history
             accumulates instead of overwriting.
   Optional blocks (Friday Flex) sit outside the queue entirely.
   ============================================================ */
const FIXED=[],CYCLE=[],OPTIONAL=[];
BLOCKS.forEach(b=>{
  b.days.forEach(d=>{
    const day={...d,blockId:b.id,blockName:b.name,color:b.color,icon:b.icon,repeating:!!b.repeating};
    if(b.optional)OPTIONAL.push(day);
    else if(b.repeating)CYCLE.push(day);
    else FIXED.push(day);
  });
});
const ALL_DAYS=[...FIXED,...CYCLE,...OPTIONAL];
const MAX_CYCLES=24; // ~6 months of in-season weeks; far beyond November.

/* A repeating session's log key carries its cycle number. */
const keyFor=(day,cycle)=>day.repeating?("s_"+day.id+"_c"+(cycle||0)):("s_"+day.id);
const isDone=(logs,day,cycle)=>{const l=logs[keyFor(day,cycle)];return!!(l&&l.completed);};

/* First incomplete session: walk the fixed prefix, then cycle
   through the in-season rotation until an unfinished one turns up. */
function nextUp(logs){
  for(const d of FIXED){if(!isDone(logs,d,0))return{day:d,cycle:0};}
  for(let c=0;c<MAX_CYCLES;c++){
    for(const d of CYCLE){if(!isDone(logs,d,c))return{day:d,cycle:c};}
  }
  return{day:CYCLE[CYCLE.length-1],cycle:MAX_CYCLES-1};
}
const totalCompleted=logs=>Object.values(logs).filter(l=>l&&l.completed&&!l.legacy).length;

/* Group label, derived from how many exercises share a group key. */
const GROUP_LABEL=(items)=>{
  const n=items.length,r=items[0].sets;
  const kind=n>=3?"Tri-Set":n===2?"Superset":"Straight Set";
  return kind+" \u2014 "+r+" rounds "+D+" Zone "+items[0].zone;
};
function groupExercises(ex){
  const out=[];
  ex.forEach(x=>{const last=out[out.length-1];
    if(last&&last.key===x.group)last.items.push(x);else out.push({key:x.group,items:[x]});});
  return out;
}

/* ============================================================
   HISTORY — keyed by slug, so it follows the movement forever.
   ============================================================ */
function buildHistory(logs){
  const h={};
  Object.entries(logs)
    .filter(([_,l])=>l&&l.exercises)
    .sort((a,b)=>{const da=a[1].date||a[0],db=b[1].date||b[0];return String(da).localeCompare(String(db));})
    .forEach(([key,log])=>{
      const date=log.date||key.split("_")[0];
      Object.entries(log.exercises).forEach(([slug,sets])=>{
        const done=Object.entries(sets)
          .filter(([_,s])=>s&&s.done&&(s.weight!==""&&s.weight!=null||s.reps))
          .sort((a,b)=>Number(a[0])-Number(b[0]))
          .map(([i,s])=>({weight:s.weight!==""&&s.weight!=null?Number(s.weight):null,
                          reps:s.reps!==""&&s.reps!=null?Number(s.reps):null}));
        if(!done.length)return;
        (h[slug]=h[slug]||[]).push({date,logKey:key,sets:done});
      });
    });
  return h;
}
const lastEntry=(hist,slug,excludeKey)=>{
  const list=(hist[slug]||[]).filter(e=>e.logKey!==excludeKey);
  return list.length?list[list.length-1]:null;
};
const prFor=(hist,slug)=>{
  let max=0;(hist[slug]||[]).forEach(e=>e.sets.forEach(s=>{if(s.weight&&s.weight>max)max=s.weight;}));
  return max||null;
};
const fmtSets=entry=>entry.sets.map(s=>(s.weight!=null?s.weight:"BW")+(s.reps?X+s.reps:"")).join("  ");

/* ============================================================
   COMPONENTS
   ============================================================ */
function RestTimer({seconds,onDone,onSkip}){
  const end=useRef(Date.now()+seconds*1000);
  const [rem,setRem]=useState(seconds);
  const ref=useRef();
  useEffect(()=>{
    end.current=Date.now()+seconds*1000;
    const tick=()=>{const l=Math.max(0,Math.round((end.current-Date.now())/1000));setRem(l);
      if(l<=0){clearInterval(ref.current);try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}setTimeout(onDone,300);}};
    ref.current=setInterval(tick,250);
    const vis=()=>{if(document.visibilityState==="visible")tick();};
    document.addEventListener("visibilitychange",vis);
    return()=>{clearInterval(ref.current);document.removeEventListener("visibilitychange",vis);};
  },[seconds]);
  const pct=seconds>0?(rem/seconds)*100:0;
  return<div style={{position:"fixed",inset:0,background:T.timerBg,zIndex:200,display:"flex",
    flexDirection:"column",alignItems:"center",justifyContent:"center",gap:18}}>
    <div style={{...HS,fontSize:14,color:T.textDim}}>Rest</div>
    <div style={{...MS,fontSize:72,color:T.accent,fontWeight:600}}>{fmtTime(rem)}</div>
    <div style={{width:220,height:4,background:T.border,borderRadius:2}}>
      <div style={{height:"100%",width:pct+"%",background:T.accent,borderRadius:2,transition:"width .25s linear"}}/>
    </div>
    <button onClick={onSkip} style={{marginTop:10,padding:"10px 28px",background:"transparent",
      border:"1px solid "+T.border,borderRadius:8,color:T.text,fontSize:15,cursor:"pointer"}}>Skip</button>
  </div>;
}

function NumIn({value,onChange,placeholder,step,width}){
  const s=step||5,w=width||74;
  const bump=d=>{const v=Number(value||0)+d*s;onChange(v>0?String(v):"");};
  return<div style={{display:"flex",alignItems:"center",gap:4}}>
    <button onClick={()=>bump(-1)} style={{width:28,height:36,background:T.card,border:"1px solid "+T.border,
      borderRadius:6,color:T.textDim,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><I name="minus" size={13}/></button>
    <input inputMode="decimal" value={value||""} placeholder={placeholder} onChange={ev=>onChange(ev.target.value)}
      style={{width:w,height:36,background:T.bg,border:"1px solid "+T.border,borderRadius:6,color:T.text,
        textAlign:"center",fontSize:15,outline:"none"}}/>
    <button onClick={()=>bump(1)} style={{width:28,height:36,background:T.card,border:"1px solid "+T.border,
      borderRadius:6,color:T.textDim,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><I name="plus" size={13}/></button>
  </div>;
}

function SetRow({idx,ex,data,onUpdate,onToggle}){
  const done=data&&data.done;
  return<div style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",
    opacity:done?0.55:1,transition:"opacity .15s"}}>
    <div style={{...MS,width:22,fontSize:13,color:T.textMuted}}>{idx+1}</div>
    <NumIn value={data?data.weight:""} placeholder={ex.type==="bodyweight"?"BW":"lbs"}
      onChange={v=>onUpdate(ex.slug,idx,{weight:v})} step={5}/>
    <NumIn value={data?data.reps:""} placeholder={String(ex.reps||"reps")}
      onChange={v=>onUpdate(ex.slug,idx,{reps:v})} step={1} width={58}/>
    <button onClick={()=>onToggle(ex.slug,idx)} style={{marginLeft:"auto",width:40,height:36,
      background:done?T.green:"transparent",border:"1px solid "+(done?T.green:T.border),borderRadius:6,
      color:done?"#fff":T.textMuted,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <I name="check" size={17}/></button>
  </div>;
}

/* Exercise card. Shows the previous session's actual numbers inline —
   the single most useful thing to see while standing at the bar. */
function ExCard({ex,logs,onUpdate,onToggle,last,pr,grouped}){
  const mg=MG[ex.muscle]||{label:ex.muscle,color:T.accent};
  return<div style={{background:T.card,borderTop:grouped?"1px solid "+T.border:"none",
    borderRadius:grouped?0:12,padding:"12px 14px",border:grouped?undefined:"1px solid "+T.border}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
      <div style={{flex:1}}>
        <div style={{fontSize:15,fontWeight:600,color:T.text,lineHeight:1.25}}>{ex.name}</div>
        <div style={{fontSize:12,color:T.textDim,marginTop:2}}>
          <span style={{color:mg.color}}>{mg.label}</span>{" "+D+" "+ex.sets+X+(ex.reps||"max")+" "+D+" "+ex.intensity}
        </div>
      </div>
      {pr?<div style={{textAlign:"right",flexShrink:0}}>
        <div style={{...MS,fontSize:14,color:T.accent}}>{pr}</div>
        <div style={{fontSize:10,color:T.textMuted,...HS}}>PR</div>
      </div>:null}
    </div>

    {last?<div style={{marginTop:8,padding:"6px 10px",background:T.bg,borderRadius:6,
      border:"1px solid "+T.border}}>
      <div style={{fontSize:10,color:T.textMuted,...HS,marginBottom:2}}>Last {D} {last.date}</div>
      <div style={{...MS,fontSize:13,color:T.blue}}>{fmtSets(last)}</div>
    </div>:<div style={{marginTop:8,fontSize:12,color:T.textMuted,fontStyle:"italic"}}>No previous data</div>}

    <div style={{marginTop:8}}>
      {Array.from({length:ex.sets}).map((_,i)=>
        <SetRow key={i} idx={i} ex={ex} data={logs?logs[i]:null} onUpdate={onUpdate} onToggle={onToggle}/>)}
    </div>
  </div>;
}

function ActiveWorkout({day,cycle,onFinish,onBack,existingLog,logs:allLogs,logKey}){
  const hist=useMemo(()=>buildHistory(allLogs),[allLogs]);

  // Pre-populate each set with whatever was used last time for that movement.
  const buildInit=()=>{
    const init=existingLog&&existingLog.exercises?JSON.parse(JSON.stringify(existingLog.exercises)):{};
    day.ex.forEach(ex=>{
      if(init[ex.slug])return;
      const last=lastEntry(hist,ex.slug,logKey);
      if(!last)return;
      const s={};
      for(let i=0;i<ex.sets;i++){
        const src=i<last.sets.length?last.sets[i]:last.sets[last.sets.length-1];
        s[i]={weight:src.weight!=null?String(src.weight):"",reps:"",done:false};
      }
      init[ex.slug]=s;
    });
    return init;
  };

  const [log,setLog]=useState(buildInit);
  const [timer,setTimer]=useState(false);
  const [timerSec,setTimerSec]=useState(60);
  const [elapsed,setElapsed]=useState(0);
  const [view,setView]=useState("full");
  const [ci,setCi]=useState(0);
  const [confirmBack,setConfirmBack]=useState(false);
  const started=useRef(existingLog&&existingLog.startedAt?existingLog.startedAt:Date.now());
  const blockColor=COLOR(day.color);

  useEffect(()=>{const id=setInterval(()=>setElapsed(Math.floor((Date.now()-started.current)/1000)),1000);
    return()=>clearInterval(id);},[]);

  const update=(slug,i,patch)=>setLog(p=>({...p,[slug]:{...p[slug],[i]:{...(p[slug]?p[slug][i]:{}),...patch}}}));
  const toggle=(slug,i)=>{
    const ex=day.ex.find(e=>e.slug===slug);
    const done=log[slug]&&log[slug][i]&&log[slug][i].done;
    if(done){update(slug,i,{done:false});return;}
    update(slug,i,{done:true,completedAt:Date.now()});
    if(!ex)return;
    const groupItems=day.ex.filter(e=>e.group===ex.group);
    const lastOfGroup=groupItems[groupItems.length-1];
    if(slug===lastOfGroup.slug&&lastOfGroup.rest>0){setTimerSec(lastOfGroup.rest);setTimer(true);}
  };

  const totalSets=day.ex.reduce((s,e)=>s+e.sets,0);
  const doneSets=Object.values(log).reduce((s,e)=>s+Object.values(e).filter(x=>x&&x.done).length,0);
  const pct=totalSets?Math.round(doneSets/totalSets*100):0;
  const groups=useMemo(()=>groupExercises(day.ex),[day.id]);
  const payload=c=>({dayId:day.id,exercises:log,startedAt:started.current,finishedAt:Date.now(),
    elapsed,completed:c,date:localDate()});

  return<div style={{background:T.bg,color:T.text,minHeight:"100vh",maxWidth:480,margin:"0 auto",paddingBottom:100}}>
    {timer&&<RestTimer seconds={timerSec} onDone={()=>setTimer(false)} onSkip={()=>setTimer(false)}/>}

    {confirmBack&&<div style={{position:"fixed",inset:0,background:"rgba(8,14,28,0.9)",zIndex:210,
      display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{background:T.card,border:"1px solid "+T.border,borderRadius:14,padding:22,maxWidth:340}}>
        <div style={{...HS,fontSize:17,marginBottom:8}}>Leave this workout?</div>
        <div style={{fontSize:14,color:T.textDim,lineHeight:1.5,marginBottom:18}}>
          Your progress is saved and this session stays next in the queue. You can pick it back up any time.</div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setConfirmBack(false)} style={{flex:1,padding:"11px 0",background:"transparent",
            border:"1px solid "+T.border,borderRadius:8,color:T.text,fontSize:15,cursor:"pointer"}}>Stay</button>
          <button onClick={()=>onBack(payload(false))} style={{flex:1,padding:"11px 0",background:T.accent,
            border:"none",borderRadius:8,color:"#0c1525",fontSize:15,fontWeight:600,cursor:"pointer"}}>Save & exit</button>
        </div>
      </div>
    </div>}

    <div style={{position:"sticky",top:0,zIndex:50,background:T.bg,borderBottom:"1px solid "+T.border,padding:"10px 12px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <button onClick={()=>setConfirmBack(true)} aria-label="Back"
          style={{width:38,height:38,flexShrink:0,background:T.card,border:"1px solid "+T.border,borderRadius:9,
            color:T.text,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <I name="arrowLeft" size={19}/></button>
        <div style={{flex:1,minWidth:0}}>
          <div style={{...HS,fontSize:15,color:blockColor,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{day.label}</div>
          <div style={{fontSize:11,color:T.textDim}}>
            {day.blockName+(day.repeating?" "+D+" Cycle "+((cycle||0)+1):"")+" "+D+" ~"+day.minutes+" min"}</div>
        </div>
        <div style={{textAlign:"right",flexShrink:0}}>
          <div style={{...MS,fontSize:19}}>{fmtTime(elapsed)}</div>
          <div style={{fontSize:11,color:T.textDim}}>{pct+"%"}</div>
        </div>
      </div>
      <div style={{height:3,background:T.border,borderRadius:2,marginTop:8}}>
        <div style={{height:"100%",background:blockColor,borderRadius:2,width:pct+"%",transition:"width .3s"}}/>
      </div>
      <div style={{display:"flex",gap:8,marginTop:8}}>
        {[["full","Full View","list"],["single","Focus View","eye"]].map(([k,lab,ic])=>
          <button key={k} onClick={()=>setView(k)} style={{flex:1,padding:"6px 0",
            background:view===k?blockColor+"22":"transparent",border:"1px solid "+(view===k?blockColor:T.border),
            borderRadius:6,color:view===k?blockColor:T.textDim,fontSize:12,fontWeight:500,cursor:"pointer",
            display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
            <I name={ic} size={13}/> {lab}</button>)}
      </div>
    </div>

    {day.note&&<div style={{margin:"12px 14px 0",padding:"10px 12px",background:blockColor+"14",
      border:"1px solid "+blockColor+"44",borderRadius:10,fontSize:13,color:T.text,lineHeight:1.5}}>{day.note}</div>}

    <div style={{padding:"12px 14px"}}>
      {view==="full"?
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {groups.map((g,gi)=>
            <div key={gi} style={{borderLeft:"3px solid "+blockColor,borderRadius:12,overflow:"hidden"}}>
              <div style={{background:blockColor+"22",padding:"6px 14px",fontSize:11,color:blockColor,...HS}}>
                {GROUP_LABEL(g.items)}</div>
              {g.items.map(ex=><ExCard key={ex.slug} ex={ex} logs={log[ex.slug]} onUpdate={update} onToggle={toggle}
                last={lastEntry(hist,ex.slug,logKey)} pr={prFor(hist,ex.slug)} grouped/>)}
            </div>)}
        </div>
        :
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <button onClick={()=>setCi(Math.max(0,ci-1))} disabled={ci===0}
              style={{width:40,height:40,borderRadius:8,background:T.card,border:"1px solid "+T.border,
                color:ci===0?T.textMuted:T.text,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
              <I name="chevronLeft" size={20}/></button>
            <div style={{...MS,fontSize:13,color:T.textDim}}>{(ci+1)+" / "+day.ex.length}</div>
            <button onClick={()=>setCi(Math.min(day.ex.length-1,ci+1))} disabled={ci===day.ex.length-1}
              style={{width:40,height:40,borderRadius:8,background:T.card,border:"1px solid "+T.border,
                color:ci===day.ex.length-1?T.textMuted:T.text,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
              <I name="chevronRight" size={20}/></button>
          </div>
          {day.ex[ci]&&<ExCard ex={day.ex[ci]} logs={log[day.ex[ci].slug]} onUpdate={update} onToggle={toggle}
            last={lastEntry(hist,day.ex[ci].slug,logKey)} pr={prFor(hist,day.ex[ci].slug)}/>}
        </div>}
    </div>

    <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:50}}>
      <div style={{maxWidth:480,margin:"0 auto",padding:"12px 14px",
        background:"linear-gradient(transparent, "+T.bg+" 30%)"}}>
        <button onClick={()=>onFinish(payload(true))} style={{width:"100%",padding:"14px 0",
          background:pct===100?T.green:blockColor,border:"none",borderRadius:10,color:"#0c1525",fontSize:16,
          fontWeight:600,fontFamily:"'Oswald'",letterSpacing:"0.05em",textTransform:"uppercase",cursor:"pointer"}}>
          {pct===100?"Complete Workout "+TK:"Finish Workout ("+pct+"%)"}</button>
      </div>
    </div>
  </div>;
}

/* ---------- History screens ---------- */
function ExerciseDetail({slug,onBack,logs}){
  const hist=buildHistory(logs);
  const entries=(hist[slug]||[]).slice().reverse();
  const def=ALL_DAYS.flatMap(d=>d.ex).find(e=>e.slug===slug);
  const pr=prFor(hist,slug);
  return<div style={{background:T.bg,minHeight:"100vh",maxWidth:480,margin:"0 auto"}}>
    <div style={{padding:"14px",borderBottom:"1px solid "+T.border,display:"flex",alignItems:"center",gap:12}}>
      <button onClick={onBack} aria-label="Back" style={{width:38,height:38,background:T.card,
        border:"1px solid "+T.border,borderRadius:9,color:T.text,cursor:"pointer",display:"flex",
        alignItems:"center",justifyContent:"center"}}><I name="arrowLeft" size={19}/></button>
      <div style={{flex:1}}>
        <div style={{...HS,fontSize:17}}>{def?def.name:slug}</div>
        <div style={{fontSize:12,color:T.textDim}}>{entries.length+" session"+(entries.length!==1?"s":"")+(pr?"  "+D+"  PR "+pr+" lbs":"")}</div>
      </div>
    </div>
    <div style={{padding:14,display:"flex",flexDirection:"column",gap:8}}>
      {entries.length===0&&<div style={{color:T.textDim,fontSize:14}}>Nothing logged yet.</div>}
      {entries.map((e,i)=>{
        const best=Math.max(...e.sets.map(s=>s.weight||0));
        return<div key={i} style={{background:T.card,border:"1px solid "+T.border,borderRadius:10,padding:"11px 13px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
            <div style={{...MS,fontSize:13,color:T.textDim}}>{e.date}</div>
            {best>0&&best===pr&&<div style={{fontSize:10,...HS,color:T.accent,background:T.accent+"22",
              padding:"2px 7px",borderRadius:4}}>PR</div>}
          </div>
          <div style={{...MS,fontSize:14,color:T.text}}>{fmtSets(e)}</div>
        </div>;})}
    </div>
  </div>;
}

function ProgressScreen({logs,onBack}){
  const [muscle,setMuscle]=useState(null);
  const [slug,setSlug]=useState(null);
  const hist=buildHistory(logs);
  if(slug)return<ExerciseDetail slug={slug} onBack={()=>setSlug(null)} logs={logs}/>;

  const byMuscle={};
  ALL_DAYS.forEach(d=>d.ex.forEach(e=>{
    if(!byMuscle[e.muscle])byMuscle[e.muscle]={};
    byMuscle[e.muscle][e.slug]=e;

  if(muscle){
    const list=Object.values(byMuscle[muscle]||{}).sort((a,b)=>a.name.localeCompare(b.name));
    return<div style={{background:T.bg,minHeight:"100vh",maxWidth:480,margin:"0 auto"}}>
      <div style={{padding:"14px",borderBottom:"1px solid "+T.border,display:"flex",alignItems:"center",gap:12}}>

          alignItems:"center",justifyContent:"center"}}><I name="arrowLeft" size={19}/></button>

      </div>
      <div style={{padding:14,display:"flex",flexDirection:"column",gap:8}}>
        {list.map(e=>{const n=(hist[e.slug]||[]).length,pr=prFor(hist,e.slug);
          return<div key={e.slug} onClick={()=>setSlug(e.slug)} style={{background:T.card,
            border:"1px solid "+T.border,borderRadius:10,padding:"13px 14px",cursor:"pointer",
            display:"flex",alignItems:"center",gap:12}}>
            <div style={{flex:1}}>
              <div style={{fontSize:15,fontWeight:600}}>{e.name}</div>
              <div style={{fontSize:12,color:T.textDim}}>{n?n+" session"+(n!==1?"s":"")+(pr?"  "+D+"  PR "+pr:""):"No history"}</div>
            </div>
            <I name="chevronRight" size={17} color={T.textMuted}/>
          </div>;})}
      </div>
    </div>;

      <button onClick={onBack} aria-label="Back" style={{width:38,height:38,background:T.card,

        alignItems:"center",justifyContent:"center"}}><I name="arrowLeft" size={19}/></button>

            <div style={{fontSize:12,color:T.textDim}}>{exs.length+" exercises"+(logged?"  "+D+"  "+logged+" with history":"")}</div>
          </div>
          <I name="chevronRight" size={17} color={T.textMuted}/>
        </div>;})}
    </div>
  </div>;
}

/* ---------- Home ---------- */
function HomeScreen({logs,onStart,onProgress}){
  const next=nextUp(logs);
  const upNext=next.day,upCycle=next.cycle;
  const [tab,setTab]=useState(upNext?upNext.blockId:"bridge");
  const doneCount=totalCompleted(logs);
  const block=BLOCKS.find(b=>b.id===tab);
  const viewCycle=block&&block.repeating?upCycle:0;
  const days=block?ALL_DAYS.filter(d=>d.blockId===block.id):[];
  const upColor=upNext?COLOR(upNext.color):T.accent;
  const cycleTag=d=>d.repeating?"  "+D+"  Cycle "+(upCycle+1):"";

  return<div style={{background:T.bg,minHeight:"100vh",maxWidth:480,margin:"0 auto",paddingBottom:30}}>
    <div style={{padding:"18px 14px 14px"}}>
      <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:14}}>
        <span style={{...HS,fontSize:23,color:T.accent}}>RACK</span>
        <span style={{...HS,fontSize:23,color:T.text}}>IT</span>
        <span style={{...HS,fontSize:23,color:T.accent}}>UP</span>
        <div style={{marginLeft:"auto",fontSize:11,color:T.textDim,...HS}}>Fall Build</div>
      </div>

      {upNext&&<div onClick={()=>onStart(upNext,upCycle)} style={{background:upColor+"18",border:"1px solid "+upColor+"66",
        borderRadius:14,padding:"16px 16px",cursor:"pointer",marginBottom:12}}>
        <div style={{fontSize:11,...HS,color:upColor,marginBottom:5}}>Up Next {D} {upNext.blockName}{cycleTag(upNext)}</div>
        <div style={{...HS,fontSize:22,color:T.text,lineHeight:1.15}}>{upNext.label}</div>
        <div style={{fontSize:13,color:T.textDim,marginTop:4}}>
          {upNext.ex.length+" exercises "+D+" ~"+upNext.minutes+" min"+(upNext.suggested?"  "+D+"  suggested "+upNext.suggested.slice(5):"")}</div>
        <div style={{marginTop:12,padding:"11px 0",background:upColor,borderRadius:9,textAlign:"center",
          ...HS,fontSize:15,color:"#0c1525"}}>Start Workout</div>
      </div>}

      <div style={{display:"flex",gap:10}}>
        <div style={{background:T.card,border:"1px solid "+T.border,borderRadius:9,padding:"9px 8px",flex:1,textAlign:"center"}}>
          <div style={{...MS,fontSize:20,fontWeight:600}}>{doneCount}</div>
          <div style={{fontSize:11,color:T.textDim}}>Done</div></div>
        <div style={{background:T.card,border:"1px solid "+T.border,borderRadius:9,padding:"9px 8px",flex:1,textAlign:"center"}}>
          <div style={{...MS,fontSize:20,fontWeight:600}}>{QUEUE.length-doneCount}</div>
          <div style={{fontSize:11,color:T.textDim}}>Remaining</div></div>
        <button onClick={onProgress} style={{background:T.card,border:"1px solid "+T.border,borderRadius:9,
          padding:"9px 8px",flex:1,textAlign:"center",cursor:"pointer",color:T.text}}>
          <I name="trendingUp" size={19} style={{margin:"0 auto 1px",display:"block",opacity:.85}}/>
          <div style={{fontSize:11,color:T.textDim}}>Progress</div></button>
      </div>
    </div>

    <div style={{padding:"0 14px",display:"flex",gap:5,overflowX:"auto"}}>
      {BLOCKS.map(b=><button key={b.id} onClick={()=>setTab(b.id)} style={{flex:"1 0 auto",padding:"7px 10px",
        background:tab===b.id?COLOR(b.color)+"22":"transparent",
        border:"1px solid "+(tab===b.id?COLOR(b.color)+"77":T.border),borderRadius:8,cursor:"pointer",textAlign:"center"}}>
        <I name={b.icon} size={15} color={tab===b.id?COLOR(b.color):T.textMuted} style={{display:"block",margin:"0 auto 2px"}}/>
        <div style={{fontSize:10,...HS,color:tab===b.id?COLOR(b.color):T.textMuted}}>{b.name.split(" ")[0]}</div>
      </button>)}
    </div>

    <div style={{padding:"12px 14px 24px"}}>
      <div style={{...HS,fontSize:12,color:T.textDim,marginBottom:9}}>
        {block?block.name+"  "+D+"  "+block.range+(block.repeating?"  "+D+"  Cycle "+(viewCycle+1)+" of the rotation":""):""}</div>
      {block&&block.repeating&&<div style={{fontSize:12,color:T.textDim,lineHeight:1.5,marginBottom:10,
        padding:"9px 11px",background:T.card,border:"1px solid "+T.border,borderRadius:9}}>
        These 12 sessions repeat for the whole season. Finish the rotation and it starts again at cycle {viewCycle+2} with
        the wave five pounds heavier — each pass is logged separately, so progress stacks instead of overwriting.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {days.map(d=>{
          const done=isDone(logs,d,viewCycle);
          const isNext=upNext&&upNext.id===d.id&&(!d.repeating||upCycle===viewCycle);
          const c=COLOR(d.color);
          return<div key={d.id} onClick={()=>onStart(d,viewCycle)} style={{background:isNext?c+"15":T.card,
            border:"1px solid "+(isNext?c+"66":T.border),borderRadius:11,padding:"12px 14px",cursor:"pointer",
            display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:38,height:38,borderRadius:9,background:done?T.green+"22":c+"15",display:"flex",
              alignItems:"center",justifyContent:"center",flexShrink:0}}>
              {done?<I name="check" size={19} color={T.green}/>:<I name={d.icon} size={18} color={c}/>}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontSize:15,fontWeight:600,color:done?T.textDim:T.text}}>{d.label}</span>
                {isNext&&<span style={{fontSize:9,background:c,color:"#0c1525",padding:"1px 6px",borderRadius:4,...HS}}>Next</span>}
              </div>
              <div style={{fontSize:12,color:T.textDim}}>
                {(d.suggested?d.suggested.slice(5)+" "+D+" ":"")+(d.slot?d.slot+" "+D+" ":"")+d.ex.length+" exercises "+D+" ~"+d.minutes+" min"}</div>
            </div>
            <I name="chevronRight" size={17} color={T.textMuted}/>
          </div>;})}
      </div>
    </div>
  </div>;
}

/* ---------- App shell ---------- */
function App(){
  const [screen,setScreen]=useState("home");
  const [active,setActive]=useState(null); // {day, cycle}
  const [logs,setLogs]=useState(loadLogs);

  const start=(d,cycle)=>{setActive({day:d,cycle:cycle||0});setScreen("workout");};
  const persist=payload=>{const k=keyFor(active.day,active.cycle);
    const up={...logs,[k]:{...payload,cycle:active.cycle}};setLogs(up);saveLogs(up);};
  const finish=payload=>{persist(payload);setActive(null);setScreen("home");};
  const back=payload=>{persist(payload);setActive(null);setScreen("home");};

  if(screen==="workout"&&active){
    const k=keyFor(active.day,active.cycle);
    return<ActiveWorkout day={active.day} cycle={active.cycle} onFinish={finish} onBack={back}
      logs={logs} logKey={k} existingLog={logs[k]}/>;
  }
  if(screen==="progress")
    return<ProgressScreen logs={logs} onBack={()=>setScreen("home")}/>;
  return<HomeScreen logs={logs} onStart={start} onProgress={()=>setScreen("progress")}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
